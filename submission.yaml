submission:
  title: "SentinelAI - Military Predictive Maintenance Platform"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
 Military organizations often cannot accurately determine whether aircraft,
vehicles, and mission-critical equipment are truly mission-ready.
Maintenance is typically performed on fixed schedules rather than actual
equipment condition, while valuable HUMS sensor data remains underutilized,
leading to unexpected failures, reduced operational readiness, and increased costs.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    SentinelAI is an AI-powered predictive maintenance platform that analyzes
Health & Usage Monitoring System (HUMS) sensor data to predict component
failures before they occur. The platform provides health scoring, riskassessment, 
maintenance recommendations, and fleet readiness insights toimprove mission availability and reduce maintenance costs.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
- "AI-powered failure prediction using HUMS sensor data"
- "Fleet readiness and operational status dashboard"
- "Equipment health scoring and risk assessment"
- "Predictive maintenance recommendations and scheduling"
- "Real-time alerts and executive analytics reporting"                             # optional 5th

