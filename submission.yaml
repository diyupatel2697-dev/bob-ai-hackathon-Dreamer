submission:
  title: "AEGIS HUMS Platform"                           

  problem_statement: >                
 Military organizations often cannot accurately determine whether aircraft,
vehicles, and mission-critical equipment are truly mission-ready.
Maintenance is typically performed on fixed schedules rather than actual
equipment condition, while valuable HUMS sensor data remains underutilized,
leading to unexpected failures, reduced operational readiness, and increased costs.

  solution_summary: >                
    SentinelAI is an AI-powered predictive maintenance platform that analyzes
Health & Usage Monitoring System (HUMS) sensor data to predict component
failures before they occur. The platform provides health scoring, riskassessment, 
maintenance recommendations, and fleet readiness insights toimprove mission availability and reduce maintenance costs.

  key_features:                       
- "AI-powered failure prediction using HUMS sensor data"
- "Fleet readiness and operational status dashboard"
- "Equipment health scoring and risk assessment"
- "Predictive maintenance recommendations and scheduling"
- "Real-time alerts and executive analytics reporting"                             

  tech_stack:

languages:

- "TypeScript"
- "JavaScript"
 
frameworks:
- "React"
- "Tailwind CSS"
- "Vite"
 
ibm_technologies:
- "IBM Granite"
- "watsonx.ai"

databases:
- "Local JSON Data"
 
other:
- "GitHub"
- "Vercel"
- "Recharts"
 
what_we_are_most_proud_of: >

We successfully transformed a traditionally reactive maintenance process
into a predictive intelligence platform. Our solution demonstrates how AI
can convert raw HUMS telemetry into actionable maintenance decisions,
helping military organizations improve readiness while reducing costs.

known_limitations: >
This prototype currently uses simulated HUMS datasets rather than live
sensor integrations. Predictive models are demonstration-focused and have
not been trained on production military datasets. Future versions will
support real-time sensor ingestion, advanced machine learning models, and
digital twin capabilities.
 
